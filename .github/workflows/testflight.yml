name: iOS TestFlight Release (EAS Build)

on:
  workflow_dispatch:
    inputs:
      auto_submit:
        description: 'Automatically submit build to Apple TestFlight after EAS build succeeds'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    tags:
      - 'v*'

jobs:
  build-ios-testflight:
    name: Build & Submit iOS TestFlight via EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Typecheck before cloud build
        run: npx tsc --noEmit
      - name: Run EAS iOS Production Build (TestFlight)
        run: |
          if [ "${{ inputs.auto_submit }}" = "false" ]; then
            eas build --platform ios --profile production --non-interactive --no-wait
          else
            eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
          fi
